---
- hosts: elevate
  vars:
    project_path: /opt/frontend/sgdashboard-admin/sg-dashboard-admin-panel
    root_path: /opt/frontend/sgdashboard-admin
    venv_path: /opt/frontend/sgdashboard-admin/resource/virtualenv
    backen_project_path: /opt/backend/deployment
    python_version: "3.10"
    token_path: "/opt/backend/deployment/.token" 

  tasks:
    - name: Slurp hosts file
      slurp:
        src: "{{ backen_project_path }}/.token"
      register: slurpfile

    - name: Fetch the latest code
      git:
        repo: https://github.com/Vivek-M-08/sg-dashboard-admin-panel.git
        dest: "{{ project_path }}"
        version: "{{ gitBranch | default('release-2.0.0') }}"
        force: yes

    - name: Get vault credentials
      ansible.builtin.uri:
        url: "{{ vaultAddress }}sg-dashboard-admin"
        method: GET
        headers:
          X-Vault-Token: "{{ slurpfile.content | b64decode | trim }}"
        return_content: true
      register: credentials
      no_log: true

    - name: Persist vault data (restricted)
      ansible.builtin.copy:
        content: "{{ credentials.json.data | to_nice_json }}"
        dest: "{{ backen_project_path }}/data2.json"
        mode: '0600'
      when: credentials is defined and credentials.status == 200

    - name: Read Vault JSON data
      ansible.builtin.slurp:
        src: "{{ backen_project_path }}/data2.json"
      register: vault_json
      when: credentials is defined and credentials.rc == 0

    - name: Generate .env from Vault JSON data
      ansible.builtin.copy:
        dest: "{{ project_path }}/.env"
        mode: '0600'
        content: |
          {% set data = (vault_json.content | b64decode | from_json) %}
          {% for item in data | dict2items %}
          {{ item.key }}={{ item.value | string }}
          {% endfor %}
      when: vault_json is defined

    - name: Create virtual environment
      command: "python{{ python_version }} -m venv {{ venv_path }}"
      args:
        creates: "{{ venv_path }}/bin/activate"

    - name: Install requirements
      pip:
        requirements: "{{ project_path }}/requirements.txt"
        virtualenv: "{{ venv_path }}"
        extra_args: "--upgrade pip"

    - name: Ensure Streamlit logs directory exists
      ansible.builtin.file:
        path: "{{ root_path }}/logs"
        state: directory
        mode: '0755'

    - name: Create streamlit start script
      copy:
        dest: "{{ root_path }}/start-streamlit.sh"
        mode: '0755'
        content: |
          #!/bin/bash
          set -e

          cd {{ project_path }}
          source {{ venv_path }}/bin/activate

          # Streamlit env vars
          export STREAMLIT_THEME_BASE=light
          export PATH="{{ venv_path }}/bin:$PATH"

          pkill -f "streamlit run app.py" || true

          nohup streamlit run app.py \
            --server.port 8501 \
            --server.address 0.0.0.0 \
            --server.baseUrlPath admin \
            # --server.enableXsrfProtection false \
            # --server.enableCORS false \
            >> {{ root_path }}/logs/streamlit.log 2>&1 &

    - name: Start Streamlit application
      shell: |
        nohup {{ root_path }}/start-streamlit.sh > /dev/null 2>&1 &


