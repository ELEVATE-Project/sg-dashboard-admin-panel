---
- hosts: elevate
  vars:
    project_path: /opt/frontend/sgdashboard-admin/sg-dashboard-admin-panel
    root_path: /opt/frontend/sgdashboard-admin
    venv_path: /opt/frontend/sgdashboard-admin/resource/virtualenv
    backen_project_path: /opt/backend/deployment
    python_version: "3.10"
    # Added to match your first example's structure
    token_path: "/opt/backend/deployment/.token" 

  tasks:
    - name: Slurp hosts file
      slurp:
        src: "{{ backen_project_path }}/.token"
      register: slurpfile


    - name: Ensure project directories exist
      file:
        path: "{{ root_path }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ root_path }}"
        - "{{ root_path }}/logs"
        - "{{ root_path }}/resource"
      become: yes

    - name: Fetch the latest code
      git:
        repo: https://github.com/Vivek-M-08/sg-dashboard-admin-panel.git
        dest: "{{ root_path }}"
        version: "{{ gitBranch | default('release-2.0.0') }}"
        force: yes
      become: yes

    # - name: Slurp vault token file
    #   slurp:
    #     src: "{{ token_path }}"
    #   register: slurpfile
    #   become: yes

    - name: Get vault credentials
      shell: >
        curl --location --request GET '{{ vaultAddress }}sg-dashboard-admin'
        --header 'X-Vault-Token: {{ slurpfile.content | b64decode | trim }}'
        | jq '.data' > '{{ backen_project_path }}/data2.json'
      register: credentials
      become: yes

    - name: Generate .env from Vault JSON data
      shell: |
        set -o pipefail
        cat "{{ project_path }}/data2.json" | \
        tr -d '\n' | \
        grep -o '"[A-Za-z_][A-Za-z_0-9]\+"\s*:\s*\("[^"]\+"\|[0-9\.]\+\|true\|false\|null\)' | \
        sed 's/"\(.*\)"\s*:\s*"\?\([^"]\+\)"\?/\1=\2/' \
        > "{{ project_path }}/.env"
      args:
        executable: /bin/bash
      become: yes
      when: credentials is defined and credentials.rc == 0

    - name: Create virtual environment
      command: "python{{ python_version }} -m venv {{ venv_path }}"
      args:
        creates: "{{ venv_path }}/bin/activate"
      become: yes

    - name: Install requirements
      pip:
        requirements: "{{ project_path }}/requirements.txt"
        virtualenv: "{{ venv_path }}"
        extra_args: "--upgrade pip"
      become: yes

    - name: Create systemd service file
      copy:
        dest: /etc/systemd/system/streamlit.service
        content: |
          [Unit]
          Description=SG Dashboard Admin – Streamlit App
          After=network.target

          [Service]
          User=root
          WorkingDirectory={{ project_path }}
          # Load the generated .env file directly into the service environment
          EnvironmentFile={{ project_path }}/.env
          
          ExecStart={{ venv_path }}/bin/streamlit run app.py \
              --server.port 8501 \
              --server.address 0.0.0.0 \
              --server.enableCORS false

          Restart=always
          RestartSec=5

          StandardOutput=append:{{ root_path }}/logs/streamlit.out.log
          StandardError=append:{{ root_path }}/logs/streamlit.err.log

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      become: yes
    
    - name: Reload systemd and restart service
      systemd:
        name: streamlit
        state: restarted
        daemon_reload: yes
        enabled: yes
      become: yes

